
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="texte1.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>GTA</title>
</head>

<body>

    <p class="nome">Lucia</p>

    <img class="personagem" src="lucia.png" alt="Personagem selecionado">

    <div class="textos">

        <p class="etiqueta">Selecione o seu Personagem</p>

        <h1>Não é só <br>um Jogo</h1>

        <p class="texto-apoio">
            Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.
        </p>

    </div>

    <div class="menu">

        <img onclick="escolherPersonagem('Lucia', 'lucia.png', '#ff3cac')"
            class="avatar" src="lucia.png" alt="Lucia">

        <img onclick="escolherPersonagem('Jason', 'jason.png', '#00b2c9')"
            class="avatar" src="jason.png" alt="Jason">

        <img onclick="escolherPersonagem('CJ', 'cj.png', '#7ed37e')"
            class="avatar" src="cj.png" alt="CJ">

        <label class="voce">📸
            <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
        </label>

    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script src="script.js"></script>

</body>
</html>
